[package]
name = "ecklix"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
notify = "8.2.0"
parking_lot = "0.12.5"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter = "0.26"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-d = "0.8.2"
tree-sitter-elisp = "1.7.2"
tree-sitter-erlang = "0.20.0"
tree-sitter-fortran = "0.6.0"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = "0.23.1"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-julia = "0.23.1"
tree-sitter-ocaml = "0.26.0"
tree-sitter-ocamllex = "0.25.0"
tree-sitter-perl = "1.1.2"
tree-sitter-python = "0.25.0"
tree-sitter-racket = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.2"
tree-sitter-scheme = "0.24.7"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"
ts-parser-perl = "2.0.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true